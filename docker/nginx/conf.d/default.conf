server {
    listen 80;
    server_name localhost;

    # Configuration du Frontend
    root /var/www/html/Frontend/public;
    index accueil.html;

    # Page d'accueil du frontend
    location = / {
        try_files /pages/accueil.html =404;
    }

    # Routes pour les pages HTML dans le dossier pages/
    location /pages/ {
        try_files $uri $uri/ $uri.html =404;
    }

    # Gestion des requêtes API, redirigées vers le backend via /api/
    location /api/ {
        alias /var/www/html/Backend/public;
        index index.php;

        # Gestion des fichiers PHP pour le backend
        location ~ \.php$ {
            include fastcgi_params;
            fastcgi_pass my-php-container:9000;
            fastcgi_param SCRIPT_FILENAME /var/www/html/Backend/public$fastcgi_script_name;
        }
    }

    # Proxy pour Vite en mode développement
    location /@vite/ {
        proxy_pass http://my-node-container:5173;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Proxy pour les fichiers JS et CSS (en mode développement avec Vite)
    location ~* \.(js|css)$ {
        proxy_pass http://my-node-container:5173;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300;
    }
}
