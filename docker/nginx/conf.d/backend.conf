server {
    listen 8080;  #  Port différent de 80 pour éviter les conflits
    server_name localhost;

    # Définir le chemin racine pour accéder au backend PHP
    root /var/www/html/Backend/public;
    index index.php;

    # Route principale pour le backend, redirige les requêtes vers index.php
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Traitement des Routes avec le préfixes /api/
     location /api/ {
        try_files $uri /index.php?$query_string;

       # En-têtes CORS pour toutes les méthodes,
        add_header Access-Control-Allow-Origin *;
        add_header Access-Control-Allow-Methods "GET, POST, OPTIONS";
        add_header Access-Control-Allow-Headers "Content-Type, Authorization";

    if ($request_method = 'OPTIONS') {
            add_header Access-Control-Allow-Origin *;
            add_header Access-Control-Allow-Methods "GET, POST, OPTIONS";
            add_header Access-Control-Allow-Headers "Content-Type, Authorization";
            add_header Content-Length 0;
            add_header Content-Type text/plain;
            return 204;
        }
    }

    # Gestion des fichiers PHP
    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_pass my-php-container:9000;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }

}
